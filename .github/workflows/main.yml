name: Capstone CI

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install project dependencies
        run: python -m pip install Django==5.2.18 python-dotenv requests

      - name: Validate Python source files
        run: python -m compileall -q server/djangoapp server/djangoproj

      - name: Verify Django configuration
        working-directory: server
        run: python manage.py check
